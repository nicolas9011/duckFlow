<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nueva contraseña - Duck Flow</title>
  <link rel="icon" type="image/png" href="img/icon.png.png">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/auth.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- SDK de Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <div class="auth-container">
    <div class="auth-card">
      <div class="brand-header">
        <div class="brand-logo">
          <img src="img/icon.png.png" alt="Logo Duck Flow">
        </div>
        <h2>Nueva contraseña</h2>
        <p>Elige una contraseña nueva para tu cuenta</p>
      </div>

      <form id="reset-form">
        <div class="input-group">
          <label for="new-password">Nueva contraseña</label>
          <input type="password" id="new-password" required minlength="6" placeholder="Mínimo 6 caracteres" disabled>
        </div>

        <div class="input-group">
          <label for="confirm-password">Confirmar contraseña</label>
          <input type="password" id="confirm-password" required minlength="6" placeholder="Repite la contraseña" disabled>
        </div>

        <div id="reset-error" class="error-msg"></div>
        <div id="reset-success" style="color:#0f766e;font-size:13px;margin-bottom:12px;"></div>

        <button type="submit" id="btn-reset" class="btn-primary" disabled>Verificando enlace...</button>
      </form>

      <div class="auth-toggle">
        <a href="login.html" class="btn-link">Volver a iniciar sesión</a>
      </div>
    </div>
  </div>

  <script src="js/supabase.js"></script>
  <script src="js/reset-password.js"></script>
</body>
</html>
